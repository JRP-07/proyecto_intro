<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TalentFlow - Panel de Administración</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/dist/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #f1f1f1; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    </style>
</head>

<body class="bg-slate-50 min-h-screen">

    <!-- Navegación -->
    <nav class="bg-white border-b border-slate-200 px-8 py-4 flex justify-between items-center sticky top-0 z-50">
        <div class="flex items-center space-x-2">
            <div class="w-10 h-10 bg-indigo-600 rounded-lg flex items-center justify-center text-white shadow-lg">
                <i class="fas fa-users-cog"></i>
            </div>
            <span class="text-xl font-bold text-slate-800">TalentFlow <span class="text-indigo-600 font-medium">Admin</span></span>
        </div>
        <div class="flex items-center space-x-4">
            <button class="p-2 text-slate-400 hover:text-indigo-600 transition"><i class="far fa-bell text-xl"></i></button>
            <div class="h-8 w-px bg-slate-200"></div>
            <div class="flex items-center space-x-3">
                <div class="text-right hidden md:block">
                    <p class="text-xs font-bold text-slate-700">Admin User</p>
                    <p class="text-[10px] text-slate-400">Administrador</p>
                </div>
                <div class="w-10 h-10 bg-slate-200 rounded-full border-2 border-white shadow-sm overflow-hidden">
                    <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=Felix" alt="avatar">
                </div>
            </div>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto p-6">
        <!-- Header -->
        <div class="mb-8">
            <h2 class="text-2xl font-bold text-slate-800 mb-6">Resumen de Vacantes</h2>
        </div>

        <!-- Tabla y Filtros -->
        <div class="bg-white rounded-3xl shadow-sm border border-slate-100 overflow-hidden">
            <div class="p-6 border-b border-slate-100 flex flex-col md:flex-row md:items-center justify-between gap-4">
                <div class="relative w-full md:w-96">
                    <i class="fas fa-search absolute left-4 top-1/2 -translate-y-1/2 text-slate-400"></i>
                    <input type="text" id="searchInput" placeholder="Buscar por título o empresa..." 
                        class="w-full pl-12 pr-4 py-3 bg-slate-50 border-none rounded-xl focus:ring-2 focus:ring-indigo-500 outline-none text-sm">
                </div>
                <div class="flex items-center space-x-3">
                    <select id="filterModalidad" class="px-4 py-3 bg-slate-50 border-none rounded-xl text-sm outline-none focus:ring-2 focus:ring-indigo-500">
                        <option value="todos">Todas las modalidades</option>
                        <option value="remoto">Remoto</option>
                        <option value="presencial">Presencial</option>
                        <option value="hibrido">Híbrido</option>
                    </select>
                    <button onclick="fetchVacantes()" class="px-4 py-3 bg-indigo-50 text-indigo-600 rounded-xl hover:bg-indigo-100 transition">
                        <i class="fas fa-sync-alt"></i>
                    </button>
                </div>
            </div>

            <div class="overflow-x-auto custom-scrollbar">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-slate-50/50">
                            <th class="px-6 py-4 text-xs font-bold text-slate-500 uppercase">Título</th>
                            <th class="px-6 py-4 text-xs font-bold text-slate-500 uppercase">Empresa</th>
                            <th class="px-6 py-4 text-xs font-bold text-slate-500 uppercase">Ubicación</th>
                            <th class="px-6 py-4 text-xs font-bold text-slate-500 uppercase">Modalidad</th>
                            <th class="px-6 py-4 text-xs font-bold text-slate-500 uppercase">Salario</th>
                            <th class="px-6 py-4 text-xs font-bold text-slate-500 uppercase">Estado</th>
                        </tr>
                    </thead>
                    <tbody id="vacantesTable" class="divide-y divide-slate-100">
                        <!-- Los datos se cargarán aquí -->
                    </tbody>
                </table>
            </div>
            
            <div id="loadingState" class="p-20 text-center">
                <div class="inline-block animate-spin w-8 h-8 border-4 border-indigo-500 border-t-transparent rounded-full mb-4"></div>
                <p class="text-slate-500 font-medium">Cargando base de datos...</p>
            </div>

            <div id="emptyState" class="p-20 text-center hidden">
                <i class="fas fa-briefcase text-5xl text-slate-200 mb-4"></i>
                <p class="text-slate-500 font-medium">No se encontraron vacantes registradas.</p>
            </div>
        </div>
    </main>

    <script>
        let vacantes = [];

        async function fetchVacantes() {
            document.getElementById('loadingState').classList.remove('hidden');
            document.getElementById('vacantesTable').innerHTML = '';
            
            try {
                const response = await fetch('/api/admin/vacantes');
                vacantes = await response.json();
                
                renderVacantes(vacantes);
                document.getElementById('loadingState').classList.add('hidden');

            } catch (error) {
                console.error("Error al obtener datos:", error);
            }
        }

        function renderVacantes(data) {
            const table = document.getElementById('vacantesTable');
            const empty = document.getElementById('emptyState');
            
            if (data.length === 0) {
                empty.classList.remove('hidden');
                return;
            }
            empty.classList.add('hidden');
            table.innerHTML = '';

            data.forEach((v, index) => {
                const row = document.createElement('tr');
                row.className = "hover:bg-slate-50/50 transition cursor-pointer";

                const statusColor = v.estado === 'activa' ? 'text-emerald-600 bg-emerald-50' : 'text-slate-600 bg-slate-100';

                row.innerHTML = `
                    <td class="px-6 py-4">
                        <p class="text-sm font-bold text-slate-800">${v.titulo}</p>
                        <p class="text-xs text-slate-400">${v.area}</p>
                    </td>
                    <td class="px-6 py-4 text-sm text-slate-600">${v.nombre_empresa || 'N/A'}</td>
                    <td class="px-6 py-4 text-sm text-slate-600">${v.ubicacion}</td>
                    <td class="px-6 py-4 text-sm text-slate-600 capitalize">${v.modalidad}</td>
                    <td class="px-6 py-4 text-sm text-slate-600">${v.salario}</td>
                    <td class="px-6 py-4">
                        <span class="inline-block w-fit px-2 py-1 rounded-md text-[10px] font-bold uppercase ${statusColor}">${v.estado}</span>
                    </td>
                `;
                table.appendChild(row);
            });
        }

        // Filtros en tiempo real
        document.getElementById('searchInput').addEventListener('input', function(e) {
            const term = e.target.value.toLowerCase();
            const filtered = vacantes.filter(v => 
                v.titulo.toLowerCase().includes(term) || 
                (v.nombre_empresa && v.nombre_empresa.toLowerCase().includes(term))
            );
            renderVacantes(filtered);
        });

        document.getElementById('filterModalidad').addEventListener('change', function(e) {
            const val = e.target.value;
            const filtered = val === 'todos' ? vacantes : vacantes.filter(v => v.modalidad === val);
            renderVacantes(filtered);
        });

        // Inicio
        window.onload = fetchVacantes;
    </script>
</body>

</html>
